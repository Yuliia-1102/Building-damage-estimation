[project]
name = "building-damage-estimation"
version = "0.1.0"
description = "From photos of a damaged building to a preliminary cost estimate"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<2",
    "pillow>=10",
]

[project.optional-dependencies]
# Segmentation weights. Intel macs only have torch wheels up to 2.2.2.
ml = [
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
