[project]
name = "building-damage-estimation"
version = "0.1.0"
description = "From photos of a damaged building to a preliminary cost estimate"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fpdf2>=2.8.9",
    "google-genai>=1.0",
    "numpy>=1.26,<2",
    "pillow>=10",
    "pyarrow>=17,<20",
    "pydantic>=2",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
# Segmentation model. Versions the weights were tested with; Intel macs have no torch wheels after 2.2.2.
# timm is pinned because a newer one could rename the ViT layers and break loading the state_dict.
ml = [
    "torch==2.2.2",
    "torchvision==0.17.2",
    "timm==1.0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
