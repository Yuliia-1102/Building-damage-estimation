# All tunable numbers live here. Every value says where it came from.
# API keys do NOT go here - see .env.example.

[paths]
weights = "weights/dinov2_b2b_6class.pt"
cache = "cache"
cases = "data/cases"
output = "output"
prices_csv = "resources/prices_sample"   # used until the materials database is connected

[segmentation]
# Not used yet: the model tiles the full-size photo into 518 px crops. Downscaling would cut CPU time (task 2.4).
input_size = 1024

[suitability]
# A frame counts for a surface only if that surface takes at least this share of the frame (task 3.3).
# Placeholder, tuned on the test set in task 9.5.
min_facade_share = 0.05
min_roof_share = 0.05

[geometry]
default_floor_height_m = 3.0    # plan.txt, section 4
roof_shape_coef_pitched = 1.15  # plan.txt, section 5
roof_shape_coef_flat = 1.0
# Building measured from the mask: column heights / row widths at this percentile, robust to occlusion.
mask_extent_percentile = 95
# Reference objects for the height fallback (plan.txt, section 4), metres.
reference_heights_m = { door = 2.1, car = 1.5, person = 1.7 }
# Rough gross floor area per occupant for the consequence class estimate. Team assumption.
floor_area_per_person_m2 = 30.0

[uncertainty]
# Relative half-width of the range = scale_error + coverage_coef / views (task 3.6).
scale_error = 0.15   # plan.txt, section 4: ~15% from estimated scale
coverage_coef = 0.30 # placeholder, tuned in task 9.5

[confidence]
# Escalation boundaries (task 6.6). Placeholders.
high = 0.75
low = 0.45

[video]
frame_interval_s = 1.0  # task 8.1
blur_threshold = 100.0  # variance of Laplacian, task 8.2; placeholder, tuned on test clips
duplicate_similarity = 0.97   # cosine similarity above which two frames count as the same view
views_k = 5             # task 8.4, between 4 and 6
embedding_model = "vit_small_patch14_reg4_dinov2.lvd142m"   # timm, cached from Hugging Face

[prices]
max_candidates = 10     # task 5.5

[decision]
# Gemini models, chosen on 2026-10-17 with tools/model_bench.py on 9 test cases (output/bench.json).
# Building parameters read a photo: gemini-3.8-flash counted floors best (Flash-Lite models missed 9->6, 22->16).
# The decision is text only: gemini-3.1-flash-lite gave the same categories as 3.8 Flash on every case, about
# 5x faster (the UI asks it again on every parameter edit) and about 10x cheaper.
# Fixed names, not "gemini-flash-latest", so repeated runs use the same model (consistency check).
model = "gemini-3.1-flash-lite"
building_model = "gemini-3.8-flash"
retry_on_overload = 4          # attempts on 429 / 503, with exponential backoff
seed = 42   # fixed with temperature 0, for repeatable answers (task 9.4)

[ui]
max_upload_mb = 300     # task 7.1.3
