# Continuous integration: every pull request and every change of main.
#   1. get the code and install the locked dependencies (uv.lock), without the model weights;
#   2. static checks (ruff);
#   3. automated tests on the simulator engine (recorded cases, no weights, no API keys);
#   4. build the release package: source code + locked dependencies + commit id.
# On a version tag (v*) the package is also attached to a GitHub release.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write   # only used on tags, to publish the release package

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      DAMAGE_ENGINE: simulator
      DAMAGE_SIM_DELAY: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Static checks (ruff)
        run: uv run --frozen ruff check .

      - name: Recorded cases for the simulator (devpack, from release v1.0)
        uses: actions/cache@v4
        id: devpack
        with:
          path: devpack
          key: devpack-v1.0

      - name: Download devpack
        if: steps.devpack.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o devpack.zip "https://github.com/${{ github.repository }}/releases/download/v1.0/devpack.zip"
          unzip -q devpack.zip && rm devpack.zip

      - name: Tests
        run: uv run --frozen pytest -q

  package:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the release package
        run: |
          NAME="damage-estimation-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          git archive --format=zip --prefix="${NAME}/" -o "${NAME}.zip" HEAD
          mkdir "${NAME}"
          echo "commit=${GITHUB_SHA}" > "${NAME}/BUILD_INFO"
          echo "ref=${GITHUB_REF_NAME}" >> "${NAME}/BUILD_INFO"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${NAME}/BUILD_INFO"
          zip -q "${NAME}.zip" "${NAME}/BUILD_INFO"
          echo "NAME=${NAME}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.zip

      - name: Publish on GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.NAME }}.zip
